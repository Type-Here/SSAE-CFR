# IHDP hyperparameters overrides on top of TrainConfig defaults.
# IHDP: m=25, ~747 obs, continuous outcome, oracle mu0/mu1 (PEHE ground truth).
# Only fields that differ from the defaults need to appear here.
dataset: ihdp
k_latent: 32
# Full-batch: IHDP is small, so per-batch SMD is stable.
batch_size: null
epochs: 300
# k_svd left as auto (choose_k_svd at 90% energy); no protected covariates set
# for the semi-synthetic benchmark.
energy_threshold: 0.90
# Stated explicitly even though it equals the default, because this is the value that
# defines the reference run every later change is compared against. gamma_pref is not a
# regularization detail: it is in tension with lambda_rec, and the balance between the
# two is what decides the admission gate b. Tuning that ratio is its own step, and until
# it is done these two values are a starting point rather than a choice.
gamma_pref: 1.0
lambda_rec: 1.0