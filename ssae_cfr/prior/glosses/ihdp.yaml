# IHDP covariate glosses.
#
# The redistributed IHDP files anonymize the covariates to x1..x25, but the mapping is
# recoverable: the generator that produced this benchmark (vdorie/npci, examples/
# ihdp_sim/data.R) names the 25 columns in this exact order, and the data confirms it -
# x1..x6 are the six continuous measures, x7..x25 the nineteen binaries, x10..x12 form
# the mother's-education one-hot (row sums are 0 or 1, the omitted level being college
# graduate) and x19..x25 the seven site dummies (again 0/1 row sums, the omitted site
# being New Haven).
#
# Two coding quirks found in this redistribution, neither of which affects the prior:
#   x14 (first born) is coded 1/2 rather than 0/1;
#   x16 has mean 0.96, so it is almost certainly the negation of maternal drug use
#     rather than the indicator itself.
# The prior is built from text alone - V embeds these glosses, never the column values -
# so the polarity or the coding of a binary indicator cannot change P_U. What would
# corrupt P_U is a wrong *identity* or a reordered file, which is why row order here is
# the dataset's feature_names order and must not be changed.
#
# The default prompt template asks for a physiological and prognostic reading, which
# fits the ICU and trial datasets. IHDP's covariates are obstetric and socioeconomic and
# its outcome is a cognitive test score, so this file supplies its own.
_template: Role of {gloss} in the early cognitive development of a low birth weight, premature infant.

x1: the infant's birth weight
x2: the infant's head circumference at birth
x3: the number of weeks the infant was born preterm
x4: the infant's birth order among the mother's children
x5: the neonatal health index, a summary score of the infant's health at birth
x6: the mother's age at the time of birth
x7: the infant's sex
x8: whether the infant is a twin
x9: whether the mother was married at the time of birth
x10: whether the mother's education stopped short of a high school diploma
x11: whether the mother completed high school as her highest level of education
x12: whether the mother attended some college without completing a degree
x13: whether the mother smoked cigarettes during pregnancy
x14: whether the infant is the mother's first born child
x15: whether the mother drank alcohol during pregnancy
x16: whether the mother used drugs during pregnancy
x17: whether the mother worked during pregnancy
x18: whether the mother received prenatal care
x19: enrolment at the Little Rock, Arkansas study site
x20: enrolment at the Einstein Medical Center study site in the Bronx, New York
x21: enrolment at the Harvard study site in Boston, Massachusetts
x22: enrolment at the University of Miami study site in Florida
x23: enrolment at the University of Pennsylvania study site in Philadelphia
x24: enrolment at the University of Texas study site in Dallas
x25: enrolment at the University of Washington study site in Seattle